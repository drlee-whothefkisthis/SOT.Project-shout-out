<script>
document.addEventListener("DOMContentLoaded", function () {
  console.log("[System] 장바구니 로직 (상네일 UX 풀셋 버전)");

  const AUTH_INTENT_KEY = "shout_auth_intent";
  const AUTH_LOGIN_URL = "/login";
  const UNIT_PRICE = 5000;
  const PACKAGE_THRESHOLD = 6;
  const PACKAGE_PRICE = 24900;
  const PACKAGE_LABEL_TEXT = "무제한 패키지"; // 6장 이상일 때 표시될 라벨(문구는 디자이너/운영 정책에 맞게 변경)

  function calcAmountByCount(count) {
    const c = Number(count) || 0;
    if (c >= PACKAGE_THRESHOLD) return PACKAGE_PRICE;
    return c * UNIT_PRICE;
  }

  function formatKRW(n) {
    return Number(n).toLocaleString("ko-KR") + "원";
  }

  function updateFooterMeta() {
    const count = cartItems.length;

    if (selectedCountText) selectedCountText.textContent = `${count}장`;

    if (packageLabelText) {
      packageLabelText.textContent = (count >= PACKAGE_THRESHOLD) ? PACKAGE_LABEL_TEXT : "";
    }
  }


  const TOSS_CLIENT_KEY = "test_ck_0RnYX2w532qQQl9gBdJl8NeyqApQ";
  const SUCCESS_URL = window.location.origin + "/payments-results/success";
  const FAIL_URL = window.location.origin + "/payments-results/fail";

  const THUMB_SCROLL_STEP = 280;

  const BUBBLE_API_ORIGIN = "https://plp-62309.bubbleapps.io/version-test/api/1.1/wf";
  const WF_SYNC_CART = "/api/1.1/wf/sync_cart_from_local";

  const CART_SYNC_DEBOUNCE_MS = 350;

  const currentImgEl = document.getElementById("cart-current-img"); // div (background-image)
  const thumbRowEl = document.getElementById("cart-thumb-row");

  let prevBtn = document.getElementById("cart-prev-btn");
  let nextBtn = document.getElementById("cart-next-btn");

  let container = document.getElementById("cart-list-container");
  let priceText = document.getElementById("cart-total-price");
  let checkoutBtn = document.getElementById("btn-checkout");
  let packageLabelText = document.getElementById("cart-package-label");
  let selectedCountText = document.getElementById("cart-selected-count");


  let eventListEl = document.getElementById("cart-event-list");
  let eventTemplateEl = document.getElementById("cart-event-template");


  let thumbLeftBtn = null;
  let thumbRightBtn = null;


  let cartData = { items: [] };
  let cartItems = [];

  function loadCartFromStorage() {
    const savedData = localStorage.getItem("shout_cart_data");
    if (!savedData) {
      cartItems = [];
      return;
    }
    try {
      const parsed = JSON.parse(savedData);
      if (parsed && Array.isArray(parsed.items)) {
        cartData = parsed;
        cartItems = parsed.items;
      }
    } catch (e) {
      cartItems = [];
    }
  }

  let __shout_cart_render_seq = 0; 

  function getUsersId() {
    return localStorage.getItem("shout_users_id") || "";
  }

  function getCartPhotoIds() {
    return cartItems
      .map(it => (it && it._id ? String(it._id) : ""))
      .filter(Boolean);
  }

  async function syncCartNow(reason) {
    const usersId = getUsersId();
    if (!usersId) return; 

    const photoIds = getCartPhotoIds();

    const body = new URLSearchParams();
    body.set("users_id", usersId);
    body.set("photo_ids", JSON.stringify(photoIds));

    const url = BUBBLE_API_ORIGIN.replace(/\/$/, "") + WF_SYNC_CART;

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: body.toString()
      });

      console.log("[CartSync]", reason, "status:", res.status, "count:", photoIds.length);
    } catch (err) {
      console.warn("[CartSync] failed:", reason, err);
    }
  }

  function scheduleCartSync(reason) {
    if (__shout_cart_sync_timer) clearTimeout(__shout_cart_sync_timer);
    __shout_cart_sync_timer = setTimeout(() => {
      syncCartNow(reason);
    }, CART_SYNC_DEBOUNCE_MS);
  }

  function ensureCartUi() {
    if (!container) {
      container = document.createElement("div");
      container.id = "cart-list-container";
      Object.assign(container.style, {
        maxWidth: "920px", margin: "0 auto", padding: "20px"
      });
      document.body.appendChild(container);
    }

    if (!priceText || !checkoutBtn) {
      const bar = document.createElement("div");
      bar.id = "sh-cart-footer-bar";
      Object.assign(bar.style, {
        position: "fixed", left: "0", right: "0", bottom: "0", zIndex: "999999",
        background: "#fff", borderTop: "1px solid #eee",
        boxShadow: "0 -8px 24px rgba(0,0,0,.08)", padding: "14px 16px"
      });

      const inner = document.createElement("div");
      Object.assign(inner.style, {
        maxWidth: "920px", margin: "0 auto", display: "flex",
        alignItems: "center", justifyContent: "space-between", gap: "12px"
      });

      priceText = document.createElement("div");
      priceText.id = "cart-total-price";
      Object.assign(priceText.style, { fontSize: "18px", fontWeight: "800" });
      priceText.textContent = "0";

      inner.appendChild(priceText);

      const rightCol = document.createElement("div");
      Object.assign(rightCol.style, {
        display: "flex",
        flexDirection: "column",
        gap: "8px",
        alignItems: "flex-end"
      });

      const agreeWrap = document.createElement("label");
      Object.assign(agreeWrap.style, {
        display: "flex",
        alignItems: "flex-start",
        gap: "8px",
        fontSize: "13px",
        lineHeight: "1.4",
        cursor: "pointer",
        maxWidth: "320px"
      });

      agreeWrap.appendChild(agreeText);

      checkoutBtn = document.createElement("button");
      checkoutBtn.id = "btn-checkout";
      checkoutBtn.disabled = false;
      Object.assign(checkoutBtn.style, {
        appearance: "none",
        border: "none",
        borderRadius: "10px",
        padding: "12px 16px",
        fontSize: "15px",
        fontWeight: "800",
        cursor: "pointer",
        background: "#111",
        color: "#fff",
        minWidth: "140px"
      });
      checkoutBtn.textContent = "결제하기";

      rightCol.appendChild(agreeWrap);
      rightCol.appendChild(checkoutBtn);
      inner.appendChild(rightCol);

      bar.appendChild(inner);
      document.body.style.paddingBottom = "84px";
      document.body.appendChild(bar);
    }

    if (thumbRowEl) {
      thumbRowEl.classList.add("sh-thumb-strip");
      Object.assign(thumbRowEl.style, {
        overflowX: "auto",
        overflowY: "hidden",
        WebkitOverflowScrolling: "touch"
      });

      const thumbsWrap = thumbRowEl.closest(".cart-preview-thumbs-wrap") || thumbRowEl.parentElement;
      if (thumbsWrap) {
        const cs = window.getComputedStyle(thumbsWrap);
        if (cs.position === "static") thumbsWrap.style.position = "relative";

        if (!thumbLeftBtn) {
          thumbLeftBtn = document.createElement("button");
          thumbLeftBtn.type = "button";
          thumbLeftBtn.className = "sh-thumb-nav-btn is-left";
          thumbLeftBtn.textContent = "‹";
          thumbsWrap.appendChild(thumbLeftBtn);
        }
        if (!thumbRightBtn) {
          thumbRightBtn = document.createElement("button");
          thumbRightBtn.type = "button";
          thumbRightBtn.className = "sh-thumb-nav-btn is-right";
          thumbRightBtn.textContent = "›";
          thumbsWrap.appendChild(thumbRightBtn);
        }

        const updateThumbNav = () => {
          const max = thumbRowEl.scrollWidth - thumbRowEl.clientWidth;
          const hasOverflow = max > 2;
          thumbsWrap.classList.toggle("is-overflow", hasOverflow);

          if (!hasOverflow) {
            thumbLeftBtn.disabled = true;
            thumbRightBtn.disabled = true;
            return;
          }
          const x = thumbRowEl.scrollLeft;
          thumbLeftBtn.disabled = x <= 1;
          thumbRightBtn.disabled = x >= (max - 1);
        };

        thumbLeftBtn.onclick = () => {
          thumbRowEl.scrollBy({ left: -Math.round(thumbRowEl.clientWidth * 0.8), behavior: "smooth" });
        };
        thumbRightBtn.onclick = () => {
          thumbRowEl.scrollBy({ left: Math.round(thumbRowEl.clientWidth * 0.8), behavior: "smooth" });
        };

        thumbRowEl.addEventListener("scroll", updateThumbNav, { passive: true });
        window.addEventListener("resize", updateThumbNav);

        setTimeout(updateThumbNav, 0);
      }
    }

    if (currentImgEl) {
      const host = currentImgEl.parentElement;
      if (host) {
        host.classList.add("sh-cart-preview-host");

        const cs = window.getComputedStyle(host);
        if (cs.position === "static") host.style.position = "relative";

        if (!prevBtn) {
          prevBtn = document.createElement("button");
          prevBtn.id = "cart-prev-btn";
          prevBtn.className = "sh-cart-nav-btn is-prev";
          prevBtn.type = "button";
          prevBtn.innerHTML = "‹";
          host.appendChild(prevBtn);
        }
        if (!nextBtn) {
          nextBtn = document.createElement("button");
          nextBtn.id = "cart-next-btn";
          nextBtn.className = "sh-cart-nav-btn is-next";
          nextBtn.type = "button";
          nextBtn.innerHTML = "›";
          host.appendChild(nextBtn);
        }
      }
    }
  }


  let currentIndex = 0;

  function setCurrentPreview(src){
    if (!src) {
      __shout_setActivePreviewBg("");
      return;
    }
    __shout_setActivePreviewBg(src);
  }

  function setIndex(nextIdx){
    if (cartItems.length === 0) return;
    currentIndex = (nextIdx + cartItems.length) % cartItems.length;
  }

  function scrollSelectedThumbIntoView(){
    if (!thumbRowEl) return;
    const el = thumbRowEl.querySelector(`[data-thumb-idx="${currentIndex}"]`);
    if (!el) return;
    try {
      el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    } catch (e) {
      el.scrollIntoView(true);
    }
  }

  function updateThumbOverflowUI(){
    if (!thumbRowEl) return;

    const hasOverflow = thumbRowEl.scrollWidth > (thumbRowEl.clientWidth + 2);
    thumbRowEl.classList.toggle("is-overflow", hasOverflow);

    if (thumbLeftBtn) {
      const atLeft = thumbRowEl.scrollLeft <= 2;
      thumbLeftBtn.classList.toggle("is-disabled", !hasOverflow || atLeft);
    }
    if (thumbRightBtn) {
      const maxLeft = thumbRowEl.scrollWidth - thumbRowEl.clientWidth;
      const atRight = thumbRowEl.scrollLeft >= (maxLeft - 2);
      thumbRightBtn.classList.toggle("is-disabled", !hasOverflow || atRight);
    }
  }

  function renderCartPreviewUI() {
    if (!currentImgEl || !thumbRowEl) return;

    if (cartItems.length === 0) {
      const keepLeft = thumbLeftBtn;
      const keepRight = thumbRightBtn;

      thumbRowEl.innerHTML = "";
      if (keepLeft) thumbRowEl.appendChild(keepLeft);
      if (keepRight) thumbRowEl.appendChild(keepRight);

      setCurrentPreview("");
      updateThumbOverflowUI();
      return;
    }

    if (currentIndex >= cartItems.length) currentIndex = 0;

    const currentItem = cartItems[currentIndex];
    if (currentItem && currentItem.preview_url) {
      const safeSrc = currentItem.preview_url.startsWith("http")
        ? currentItem.preview_url
        : "https:" + currentItem.preview_url;
      setCurrentPreview(safeSrc);
    }

    const keepLeft = thumbLeftBtn;
    const keepRight = thumbRightBtn;

    thumbRowEl.innerHTML = "";
    cartItems.forEach((item, idx) => {
      const thumbBox = document.createElement("div");
      const isSelected = (idx === currentIndex);

      thumbBox.setAttribute("data-thumb-idx", String(idx));

      Object.assign(thumbBox.style, {
        width: "60px", height: "60px", flex: "0 0 auto",
        borderRadius: "10px", overflow: "hidden", cursor: "pointer",
        border: isSelected ? "2px solid #3b82f6" : "2px solid transparent",
        opacity: isSelected ? "1" : "0.5",
        transition: "all 0.2s ease"
      });

      const img = document.createElement("div");
      const bgUrl = item.preview_url.startsWith("http")
        ? item.preview_url
        : "https:" + item.preview_url;

      Object.assign(img.style, {
        width: "100%", height: "100%",
        backgroundImage: `url(${bgUrl})`,
        backgroundSize: "cover",
        backgroundPosition: "center",
        transform: isSelected ? "scale(1.1)" : "scale(1)",
        transition: "transform 0.2s ease"
      });

      thumbBox.appendChild(img);
      thumbBox.addEventListener("click", () => {
        currentIndex = idx;
        renderCartPreviewUI();
      });

      thumbRowEl.appendChild(thumbBox);
    });

    if (keepLeft) thumbRowEl.appendChild(keepLeft);
    if (keepRight) thumbRowEl.appendChild(keepRight);

    setTimeout(() => {
      scrollSelectedThumbIntoView();
      updateThumbOverflowUI();
    }, 0);
  }

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function getEventCodeFromItem(item) {
    if (item && item.event_code) return String(item.event_code);
    const fn = item && item.fileName ? String(item.fileName) : "";
    // 예상 경로: marathon-2026/01-jan/260104-geumsan/jpg/...
    const parts = fn.split("/").filter(Boolean);
    if (parts.length >= 3) return parts[2];
    return "UNKNOWN";
  }

  function getEventDisplayNameFromItem(item, eventCode) {
    if (item && item.event_display_name) return String(item.event_display_name);
    // (하위호환) cartData.event_meta에 들어있으면 사용
    if (cartData && cartData.event_meta && cartData.event_meta.event_display_name) {
      return String(cartData.event_meta.event_display_name);
    }
    return eventCode || "UNKNOWN";
  }

  // 대회별 패키지 규칙 (대회 단위로 계산)
  function calcEventAmountByCount(count) {
    return (count >= PACKAGE_THRESHOLD) ? PACKAGE_PRICE : (count * UNIT_PRICE);
  }

  function buildEventGroups(items) {
    const map = new Map(); // event_code => { event_code, event_display_name, items: [] }
    (items || []).forEach((it) => {
      const code = getEventCodeFromItem(it);
      const name = getEventDisplayNameFromItem(it, code);
      if (!map.has(code)) map.set(code, { event_code: code, event_id: (it && (it.event_id || it.eventId)) || code, event_display_name: name, items: [] });
      map.get(code).items.push(it);
    });
    return Array.from(map.values());
  }

  const BUBBLE_DATA_ORIGIN = (BUBBLE_API_ORIGIN || "").replace("/api/1.1/wf", "/api/1.1/obj");

  async function hydrateGroupDisplayNames(groups) {
    if (!Array.isArray(groups) || groups.length === 0) return;
    if (!BUBBLE_DATA_ORIGIN || !BUBBLE_DATA_ORIGIN.includes("/api/1.1/obj")) return;

    // 같은 event_id는 1번만 조회
    const need = [];
    const seen = new Set();

    groups.forEach((g) => {
      const missing = !g.event_display_name || String(g.event_display_name).trim() === "" || g.event_display_name === "UNKNOWN";
      const eventId = g.event_id || g.event_code; // 우선 event_id를 기대, 없으면 코드라도
      if (!missing) return;
      if (!eventId) return;
      if (seen.has(eventId)) return;
      seen.add(eventId);
      need.push({ g, eventId });
    });

    if (need.length === 0) return;

    const fetchOne = async (eventId) => {
      const constraints = encodeURIComponent(JSON.stringify([
        { key: "event_code", constraint_type: "equals", value: String(eventId) }
      ]));
      const url = `${BUBBLE_DATA_ORIGIN}/event?constraints=${constraints}`;
      const r = await fetch(url, { method: "GET" });
      if (!r.ok) return null;
      const j = await r.json().catch(() => null);
      const res = j && j.response && Array.isArray(j.response.results) ? j.response.results : [];
      return res[0] || null;
    };

    // 병렬 조회(필요 최소)
    const results = await Promise.allSettled(need.map((x) => fetchOne(x.eventId)));

    results.forEach((r, idx) => {
      if (!r || r.status !== "fulfilled") return;
      const data = r.value;
      if (!data) return;

      const name = data.event_display_name || data.display_name || data.name;
      if (!name) return;

      const target = need[idx].g;
      target.event_display_name = String(name);

      try {
        const raw = localStorage.getItem("shout_cart_data");
        const parsed = raw ? JSON.parse(raw) : null;
        if (parsed && Array.isArray(parsed.items)) {
          parsed.items.forEach((it) => {
            const itEventId = it.event_id || it.eventId || it.event_code;
            if (String(itEventId || "") === String(need[idx].eventId)) {
              it.event_display_name = String(name);
            }
          });
          if (parsed.event_meta) {
            parsed.event_meta.event_display_name = parsed.event_meta.event_display_name || String(name);
          }
          localStorage.setItem("shout_cart_data", JSON.stringify(parsed));
        }
      } catch (e) {
        // ignore
      }
    });
  }

  function hideLegacySingleEventUI() {

    const hideUp = (el) => {
      if (!el) return;
      el.style.display = "none";
      const wrap = el.closest && el.closest(".preview-wrapper, .nav-wrapper, .cart-wrapper, .list-wrapper");
      if (wrap) wrap.style.display = "none";
    };

    hideUp(currentImgEl);
    hideUp(thumbRowEl);

    if (prevBtn) prevBtn.style.display = "none";
    if (nextBtn) nextBtn.style.display = "none";

    hideUp(container);
  }

  function buildSectionPreviewDOM() {
    const wrap = document.createElement("div");
    wrap.className = "cart-preview";

    const current = document.createElement("div");
    current.className = "cart-preview-current";

    let prev = document.createElement("button");
    prev.type = "button";
    prev.className = "cart-preview-btn cart-preview-prev";
    prev.textContent = "이전";

    let next = document.createElement("button");
    next.type = "button";
    next.className = "cart-preview-btn cart-preview-next";
    next.textContent = "다음";

wrap.classList.add("sh-cart-preview-host");
{
  const csWrap = window.getComputedStyle(wrap);
  if (csWrap.position === "static") wrap.style.position = "relative";
}

const prevOverlay = document.createElement("button");
prevOverlay.type = "button";
prevOverlay.className = "sh-cart-nav-btn is-prev";
prevOverlay.innerHTML = "‹";

const nextOverlay = document.createElement("button");
nextOverlay.type = "button";
nextOverlay.className = "sh-cart-nav-btn is-next";
nextOverlay.innerHTML = "›";

prevOverlay.style.opacity = "1";
prevOverlay.style.pointerEvents = "auto";
nextOverlay.style.opacity = "1";
nextOverlay.style.pointerEvents = "auto";

wrap.appendChild(prevOverlay);
wrap.appendChild(nextOverlay);

prev = prevOverlay;
next = nextOverlay;

const thumbsWrap = document.createElement("div");
    thumbsWrap.className = "cart-preview-thumbs-wrap";

    const thumbs = document.createElement("div");
    thumbs.className = "cart-preview-thumbs";

    thumbsWrap.appendChild(thumbs);

    wrap.appendChild(current);

    wrap.appendChild(thumbsWrap);

    return { wrap, current, thumbs, prev, next };
  }

  function normalizeUrl(url) {
    if (!url) return "";
    const s = String(url);
    if (s.startsWith("http")) return s;
    if (s.startsWith("//")) return "https:" + s;
    return s;
  }

  function bindSectionPreview(mountEl, items) {
    if (!mountEl) return;
    const list = Array.isArray(items) ? items : [];
    const ui = buildSectionPreviewDOM();
    mountEl.innerHTML = "";
    mountEl.appendChild(ui.wrap);

    let idx = 0;

    function renderThumbs() {
      ui.thumbs.innerHTML = "";
      list.forEach((it, i) => {
        const t = document.createElement("div");
        t.className = "cart-thumb" + (i === idx ? " is-active" : "");
        const u = normalizeUrl(it && it.preview_url);
        if (u) t.style.backgroundImage = `url("${u}")`;
        t.addEventListener("click", () => {
          idx = i;
          renderCurrent();
        });
        ui.thumbs.appendChild(t);
      });
    }

    function renderCurrent() {
      const it = list[idx];
      const u = normalizeUrl(it && it.preview_url);
      ui.current.style.backgroundImage = u ? `url("${u}")` : "none";

      Array.from(ui.thumbs.children).forEach((node, i) => {
        node.classList.toggle("is-active", i === idx);
      });

      ui.prev.disabled = (idx <= 0);
      ui.next.disabled = (idx >= list.length - 1);
    }

    function setupPerEventThumbNav() {
      const thumbRowEl = ui.thumbs;
      if (!thumbRowEl) return;

      const thumbsWrap = ui.wrap && ui.wrap.querySelector(".cart-preview-thumbs-wrap");
      if (!thumbsWrap) return;

      // create buttons once
      let leftBtn = thumbsWrap.querySelector(".sh-thumb-nav-btn.is-left");
      let rightBtn = thumbsWrap.querySelector(".sh-thumb-nav-btn.is-right");

      // ensure wrap is positioning context
      const cs = window.getComputedStyle(thumbsWrap);
      if (cs.position === "static") thumbsWrap.style.position = "relative";

      if (!leftBtn) {
        leftBtn = document.createElement("button");
        leftBtn.type = "button";
        leftBtn.className = "sh-thumb-nav-btn is-left";
        leftBtn.textContent = "‹";
        thumbsWrap.appendChild(leftBtn);
      }
      if (!rightBtn) {
        rightBtn = document.createElement("button");
        rightBtn.type = "button";
        rightBtn.className = "sh-thumb-nav-btn is-right";
        rightBtn.textContent = "›";
        thumbsWrap.appendChild(rightBtn);
      }

      const update = () => {
        const max = thumbRowEl.scrollWidth - thumbRowEl.clientWidth;
        const hasOverflow = max > 2;
        thumbsWrap.classList.toggle("is-overflow", hasOverflow);

        if (!hasOverflow) {
          leftBtn.disabled = true;
          rightBtn.disabled = true;
          return;
        }
        const x = thumbRowEl.scrollLeft;
        leftBtn.disabled = x <= 1;
        rightBtn.disabled = x >= (max - 1);
      };

      const step = () => Math.max(140, Math.floor(thumbRowEl.clientWidth * 0.7));

      leftBtn.onclick = () => {
        thumbRowEl.scrollBy({ left: -step(), behavior: "smooth" });
        // update after scroll settles
        setTimeout(update, 180);
      };
      rightBtn.onclick = () => {
        thumbRowEl.scrollBy({ left: step(), behavior: "smooth" });
        setTimeout(update, 180);
      };

      if (!thumbRowEl.dataset.thumbNavBound) {
        thumbRowEl.dataset.thumbNavBound = "1";
        thumbRowEl.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update);
      }

      requestAnimationFrame(() => requestAnimationFrame(update));
      setTimeout(update, 120);
    }

    ui.prev.addEventListener("click", () => {
      if (idx <= 0) return;
      idx -= 1;
      renderCurrent();
    });

    ui.next.addEventListener("click", () => {
      if (idx >= list.length - 1) return;
      idx += 1;
      renderCurrent();
    });

    renderThumbs();
    renderCurrent();
    setupPerEventThumbNav();
  }

  async function renderMultiEventAccordion() {
    const __mySeq = ++__shout_cart_render_seq;
    eventListEl = document.getElementById("cart-event-list");
    eventTemplateEl = document.getElementById("cart-event-template");

    if (!eventListEl || !eventTemplateEl) return false;

    eventTemplateEl.style.display = "none";

    hideLegacySingleEventUI();

    Array.from(eventListEl.children).forEach((ch) => {
      if (ch === eventTemplateEl) return;
      ch.remove();
    });

    const groups = buildEventGroups(cartItems);

    await hydrateGroupDisplayNames(groups);

    // latest render only
    if (__mySeq !== __shout_cart_render_seq) return false;

    // ✅ await 동안 다른 렌더가 들어왔으면, 나는 폐기
    // render token check moved below

    // ✅ 안전장치: append 직전에 다시 한번 클리어 (레이스 시 중복 방지)
    Array.from(eventListEl.children).forEach((ch) => {
      if (ch === eventTemplateEl) return;
      ch.remove();
    });

    if (groups.length === 0) {
      if (priceText) priceText.innerText = formatKRW(0);
      updateFooterMeta();
      return true;
    }

    let grandTotal = 0;

    groups.forEach((g, i) => {
      const section = eventTemplateEl.cloneNode(true);

      section.classList.remove("cart-event-template");

      const idx2 = pad2(i + 1);
      section.id = `cart-event-section-${idx2}`;
      section.style.display = "";
      section.classList.add("cart-event-section");
      section.setAttribute("data-event-code", String(g.event_code || ""));

      const header = section.querySelector(".cart-event-header");
      const body = section.querySelector(".cart-event-body");

      if (header) header.id = `cart-event-header-${idx2}`;
      if (body) body.id = `cart-event-body-${idx2}`;

      const idxEl = section.querySelector(".cart-event-index");
      const titleEl = section.querySelector(".cart-event-title");
      const subtotalEl = section.querySelector(".cart-event-subtotal");

      if (idxEl) {
        idxEl.id = `cart-event-index-${idx2}`;
        idxEl.textContent = `${idx2} / Marathon`;
      }
      if (titleEl) {
        titleEl.id = `cart-event-title-${idx2}`;
        titleEl.textContent = "2026 전마협 새해 맞이 마라톤";

      }

      const count = Array.isArray(g.items) ? g.items.length : 0;
      const subtotal = calcEventAmountByCount(count);
      grandTotal += subtotal;

      if (subtotalEl) {
        subtotalEl.id = `cart-event-subtotal-${idx2}`;
        subtotalEl.textContent = formatKRW(subtotal);
      }

      const pkgLabelEl = section.querySelector(".cart-event-package-label");
      const pkgPriceEl = section.querySelector(".cart-event-package-price");

      if (count >= PACKAGE_THRESHOLD) {
        if (pkgLabelEl) {
          pkgLabelEl.style.display = "";
          pkgLabelEl.textContent = `${count}장 ${PACKAGE_LABEL_TEXT}`;
        }
        if (pkgPriceEl) {
          pkgPriceEl.style.display = "";
          pkgPriceEl.textContent = formatKRW(PACKAGE_PRICE);
        }
      } else {
        if (pkgLabelEl) pkgLabelEl.style.display = "none";
        if (pkgPriceEl) pkgPriceEl.style.display = "none";
      }

      if (body) body.style.display = "none";

      const mount = section.querySelector(".cart-event-preview-mount");
      if (mount) {
        mount.id = `cart-event-preview-mount-${idx2}`;
        bindSectionPreview(mount, g.items);
      }

      function setOpen(open) {
        if (!body) return;
        section.classList.toggle("is-open", !!open);
        body.style.display = open ? "block" : "none";
      }

      if (header) {
        header.style.pointerEvents = "auto";
      }

      section.addEventListener("click", (ev) => {
        const h = ev.target && ev.target.closest ? ev.target.closest(".cart-event-header") : null;
        if (!h) return;
        const isOpen = section.classList.contains("is-open");
        setOpen(!isOpen);
      }, true);

      eventListEl.appendChild(section);
    });

    if (priceText) priceText.innerText = formatKRW(grandTotal);

    if (selectedCountText) selectedCountText.textContent = `${cartItems.length}장`;

    if (packageLabelText) packageLabelText.textContent = "";

    return true;
  }

  function renderCartList() {
    if (!container) return;

    if (cartItems.length === 0) {
      container.innerHTML = "<div style='padding:40px; text-align:center; color:#888;'>장바구니가 비어있습니다.</div>";
      if (priceText) priceText.innerText = formatKRW(0);
      updateFooterMeta();
      return;
    }

    container.innerHTML = "";

    cartItems.forEach((item, index) => {
      const itemDiv = document.createElement("div");
      Object.assign(itemDiv.style, {
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        padding: "15px 0",
        borderBottom: "1px solid #eee"
      });

      const safeSrc = item.preview_url.startsWith("http") ? item.preview_url : "https:" + item.preview_url;

      itemDiv.innerHTML = `
        <div style="display:flex; alignItems:center; gap:15px;">
          <img src="${safeSrc}" style="width:80px; height:80px; object-fit:cover; border-radius:4px; background:#f0f0f0;">
          <div>
            <div style="font-weight:bold; font-size:14px;">${item.fileName || "사진"}</div>
            <div style="font-size:12px; color:#666;">5,000원</div>
          </div>
        </div>
        <button class="remove-btn" data-index="${index}" style="
          background:none; border:1px solid #ddd; padding:5px 10px;
          border-radius:4px; font-size:12px; cursor:pointer; color:#555;">삭제</button>
      `;
      container.appendChild(itemDiv);
    });

    document.querySelectorAll(".remove-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        removeItem(this.getAttribute("data-index"));
      });
    });

    const total = calcAmountByCount(cartItems.length);
    if (priceText) priceText.innerText = formatKRW(total);
    updateFooterMeta();
    if (checkoutBtn) checkoutBtn.innerText = "결제하기";
  }

  function removeItem(index) {
    cartItems.splice(index, 1);
    cartData.items = cartItems;
    localStorage.setItem("shout_cart_data", JSON.stringify(cartData));

    if (currentIndex >= cartItems.length) currentIndex = Math.max(0, cartItems.length - 1);

    renderCartList();
    renderCartPreviewUI();

    scheduleCartSync("remove_item");
  }

  const BUBBLE_CREATE_ORDER_API = "https://plp-62309.bubbleapps.io/version-test/api/1.1/wf/create-order";

  async function callCreateOrder(orderId, usersId, photoIds) {
    const body = new URLSearchParams();
    body.set("orderId", String(orderId || ""));
    body.set("users_id", String(usersId || ""));
    body.set("bib", String((cartData && cartData.bib) || ""));
    body.set("photo_ids", JSON.stringify(photoIds || []));

    const res = await fetch(BUBBLE_CREATE_ORDER_API, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: body.toString()
    });

    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error("create-order failed: " + res.status + " " + t);
    }

    const data = await res.json().catch(() => ({}));
    return data;
  }



  async function startPayment() {
    if (cartItems.length === 0) {
      alert("장바구니가 비어있습니다.");
      return;
    }

    const uid = localStorage.getItem("shout_users_id");
    if (!uid) {
      sessionStorage.setItem(AUTH_INTENT_KEY, JSON.stringify({ return_to: location.href, after: "start_payment" }));
      sessionStorage.setItem("shout_cart_sync_needed", "true");
      location.href = AUTH_LOGIN_URL;
      return;
    }

    syncCartNow("before_payment");

    const tossPayments = TossPayments(TOSS_CLIENT_KEY);
    const orderId = "ORDER-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    
    sessionStorage.setItem("shout_last_order_id", orderId);
    console.log("[PAY][REQ] orderId =", orderId);

    let __shout_server_amount = null;
    try {
      const __photoIds = getCartPhotoIds();
      const __created = await callCreateOrder(orderId, uid, __photoIds);

      const __amtRaw =
        (__created && (__created.amount ?? (__created.response && __created.response.amount))) ?? null;

      __shout_server_amount = Number(__amtRaw);
      console.log("[PAY][REQ] amount(server) =", __shout_server_amount, "photoCount =", __photoIds.length);
    } catch (e) {
      console.error("[PAY][REQ] create-order error:", e);
      alert("주문 생성에 실패했습니다. 잠시 후 다시 시도해주세요.");
      return;
    }

    if (!Number.isFinite(__shout_server_amount) || __shout_server_amount <= 0) {
      console.error("[PAY][REQ] invalid server amount:", __shout_server_amount);
      alert("결제 금액 확인에 실패했습니다. 다시 시도해주세요.");
      return;
    }
tossPayments.requestPayment('카드', {
      amount: __shout_server_amount,
      orderId: orderId,
      orderName: (cartItems.length >= PACKAGE_THRESHOLD)
        ? `마라톤 사진 ${cartItems.length}장 (무제한 패키지)`
        : `마라톤 사진 ${cartItems.length}장`,
      customerName: 'Shout-out Customer',
      successUrl: SUCCESS_URL,
      failUrl: FAIL_URL,
    }).catch(err => {
      if (err.code !== 'USER_CANCEL') alert(err.message);
    });
  }

  let __SHOUT_CART_PREVIEW_NAV_BOUND = false;

  function bindPreviewNav(){
    if (__SHOUT_CART_PREVIEW_NAV_BOUND) return;
    __SHOUT_CART_PREVIEW_NAV_BOUND = true;

    if (!prevBtn || !nextBtn) return;

    prevBtn.addEventListener("click", () => {
      setIndex(currentIndex - 1);
      renderCartPreviewUI();
    });

    nextBtn.addEventListener("click", () => {
      setIndex(currentIndex + 1);
      renderCartPreviewUI();
    });

    window.addEventListener("keydown", (e) => {
      const tag = (document.activeElement && encourageTag(document.activeElement.tagName) || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || document.activeElement?.isContentEditable) return;

      if (e.key === "ArrowLeft") {
        setIndex(currentIndex - 1);
        renderCartPreviewUI();
      } else if (e.key === "ArrowRight") {
        setIndex(currentIndex + 1);
        renderCartPreviewUI();
      }
    });
  }


  let __SHOUT_CART_PREVIEW_SWIPE_BOUND = false;

  
  function __shout_getActivePreviewHost() {
    const list = Array.from(document.querySelectorAll(".cart-preview-current"));
    if (list.length === 0) return null;
    const vis = list.find(el => el.offsetParent !== null) || list[0];
    return vis;
  }

  function __shout_setActivePreviewBg(url) {
    const host = __shout_getActivePreviewHost();
    if (!host) return;
    if (!url) {
      host.style.backgroundImage = "";
      return;
    }
    host.style.backgroundImage = `url("${url}")`;
  }


  function bindPreviewSwipeIOS() {
    if (__SHOUT_CART_PREVIEW_SWIPE_BOUND) return;
    __SHOUT_CART_PREVIEW_SWIPE_BOUND = true;

    let host = __shout_getActivePreviewHost();
    if (!host) return;

    let __HOST_BG_INLINE_BEFORE = { bgImage: "", bgColor: "" };
    let __HOST_BG_COMPUTED_BEFORE = { bgImage: "", bgColor: "" };
    let __HOST_BG_HIDDEN = false;

    function hideHostBg() {
      if (__HOST_BG_HIDDEN) return;
      __HOST_BG_HIDDEN = true;
      host.style.backgroundImage = "none";
      host.style.backgroundColor = __HOST_BG_COMPUTED_BEFORE.bgColor || "#000";
    }

    function restoreHostBg() {
      if (!__HOST_BG_HIDDEN) return;
      __HOST_BG_HIDDEN = false;

      host.style.backgroundColor = "";
      host.style.backgroundImage = "";
      try {
        const item = cartItems[currentIndex];
        setCurrentPreview(item && item.preview_url ? item.preview_url : "");
      } catch (e) {
      }
    }

    const hostCS = getComputedStyle(host);
    if (hostCS.position === "static") host.style.position = "relative";

    const SWIPE_WRAP_ID = "sh-cart-swipe-wrap";
    const SWIPE_TRACK_ID = "sh-cart-swipe-track";
    const PANEL_PREV_ID = "sh-cart-swipe-prev";
    const PANEL_CUR_ID  = "sh-cart-swipe-cur";
    const PANEL_NEXT_ID = "sh-cart-swipe-next";

    let wrap = document.getElementById(SWIPE_WRAP_ID);
    let track, pPrev, pCur, pNext;

    function ensureSwipeDom() {
      try {
        const csHost = getComputedStyle(host);
        if (csHost.position === "static") host.style.position = "relative";
      } catch(_) {}

      wrap = document.getElementById(SWIPE_WRAP_ID);
      if (!wrap) {
        wrap = document.createElement("div");
        wrap.id = SWIPE_WRAP_ID;
        Object.assign(wrap.style, {
          position: "absolute",
          inset: "0",
          overflow: "hidden",
          background: "transparent",
          zIndex: "5",
          display: "none",
          touchAction: "pan-y",
          overscrollBehavior: "contain"
        });
        host.appendChild(wrap);
      }

      try {
        const cs = getComputedStyle(host);
        wrap.style.background = cs.backgroundColor || "transparent";
      } catch(_) {}

      track = document.getElementById(SWIPE_TRACK_ID);
      if (!track) {
        track = document.createElement("div");
        track.id = SWIPE_TRACK_ID;
        Object.assign(track.style, {
          display: "flex",
          width: "0px", // ✅ px로 강제(갤러리 모달과 동일한 정렬)

          height: "100%",
          willChange: "transform",
          transition: "none",
          transform: "translate3d(0,0,0)"
        });
        wrap.appendChild(track);
      }

      pPrev = document.getElementById(PANEL_PREV_ID);
      if (!pPrev) { pPrev = document.createElement("div"); pPrev.id = PANEL_PREV_ID; }
      pCur  = document.getElementById(PANEL_CUR_ID);
      if (!pCur)  { pCur  = document.createElement("div"); pCur.id  = PANEL_CUR_ID; }
      pNext = document.getElementById(PANEL_NEXT_ID);
      if (!pNext) { pNext = document.createElement("div"); pNext.id = PANEL_NEXT_ID; }

      [pPrev, pCur, pNext].forEach((el) => {
        Object.assign(el.style, {
          flex: "0 0 auto",
          width: "0px",
          minWidth: "0px", 
          height: "100%",
          backgroundPosition: "center",
          backgroundRepeat: "no-repeat",
          backgroundSize: "contain",
          backgroundColor: "transparent",
          boxSizing: "border-box",
          padding: "0px",
          backgroundClip: "border-box",
          backgroundOrigin: "border-box",
          userSelect: "none",
          WebkitUserDrag: "none",
          touchAction: "pan-y",
          overscrollBehavior: "contain"
        });
      });

      if (pPrev.parentElement !== track) track.appendChild(pPrev);
      if (pCur.parentElement  !== track) track.appendChild(pCur);
      if (pNext.parentElement !== track) track.appendChild(pNext);
    }


    function applySwipeSizes() {
      if (!wrap || !track || !pPrev || !pCur || !pNext) return;
      const w = getViewportW();
      if (!w) return;

      track.style.width = (w * 3) + "px";
      [pPrev, pCur, pNext].forEach((el) => {
        el.style.width = w + "px";
        el.style.minWidth = w + "px";
        el.style.flex = "0 0 " + w + "px";
      });

      snapToCenterIdle();
    
    window.addEventListener("resize", applySwipeSizes);
    window.addEventListener("orientationchange", applySwipeSizes);
}
    function toHttps(url) {
      if (!url) return "";
      if (url.startsWith("http")) return url;
      if (url.startsWith("//")) return "https:" + url;
      return "https://" + url;
    }

    function preloadPanels(idx) {
      if (!cartItems || cartItems.length === 0) return;

      const len = cartItems.length;
      const cur  = (idx + len) % len;
      const prev = (cur - 1 + len) % len;
      const next = (cur + 1) % len;

      const curSrc  = toHttps(cartItems[cur]?.preview_url || "");
      const prevSrc = toHttps(cartItems[prev]?.preview_url || "");
      const nextSrc = toHttps(cartItems[next]?.preview_url || "");

      pCur.style.backgroundImage  = curSrc  ? `url("${curSrc}")`  : "none";
      pPrev.style.backgroundImage = prevSrc ? `url("${prevSrc}")` : "none";
      pNext.style.backgroundImage = nextSrc ? `url("${nextSrc}")` : "none";
    }

    function getViewportW() {
      const cs = getComputedStyle(wrap);
      const pl = parseFloat(cs.paddingLeft) || 0;
      const pr = parseFloat(cs.paddingRight) || 0;
      return Math.max(0, (wrap.clientWidth || 0) - pl - pr);
    }

    const ANIM_MS = 220;
    const THRESHOLD_RATIO = 0.18;
    const TAP_SLOP = 8;
    const MAX_Y = 90;

    function setTrackPx(px, withAnim) {
      if (withAnim) track.style.transition = `transform ${ANIM_MS}ms cubic-bezier(0.2, 0.8, 0.2, 1)`;
      else track.style.transition = "none";
      track.style.transform = `translate3d(${px}px, 0, 0)`;
    }

    function snapToCenterIdle() {
      const w = getViewportW();
      setTrackPx(-w, false);
    }

    function hideOverlay() {
      if (!wrap) return;
      wrap.style.display = "none";
      restoreHostBg();
      snapToCenterIdle();
    }

    let startX = 0;
    let startY = 0;
    let dx = 0;
    let dy = 0;
    let dragging = false;
    let animating = false;
    let axisLocked = null;

    host.addEventListener("touchstart", (ev) => {
      if (animating) return;
      if (!cartItems || cartItems.length === 0) return;

      const t = ev.touches && ev.touches[0];
      if (!t) return;

      ensureSwipeDom();
      preloadPanels(currentIndex);

      host = __shout_getActivePreviewHost();
      if (!host) { dragging = false; return; }

      __HOST_BG_INLINE_BEFORE = {
        bgImage: host.style.backgroundImage || "",
        bgColor: host.style.backgroundColor || ""
      };
      __HOST_BG_COMPUTED_BEFORE = (() => {
        try {
          const cs = getComputedStyle(host);
          return { bgImage: cs.backgroundImage || "", bgColor: cs.backgroundColor || "" };
        } catch (e) {
          return { bgImage: "", bgColor: "" };
        }
      })();

      hideHostBg();

      wrap.style.display = "block"; 
      applySwipeSizes();
      snapToCenterIdle();

      startX = t.clientX;
      startY = t.clientY;
      dx = 0;
      dy = 0;
      axisLocked = null;
      dragging = true;

      const w = getViewportW();
      setTrackPx(-w, false);
    }, { passive: true });

    host.addEventListener("touchmove", (ev) => {
      if (!dragging) return;

      const t = ev.touches && ev.touches[0];
      if (!t) return;

      dx = t.clientX - startX;
      dy = t.clientY - startY;

      if (!axisLocked) axisLocked = (Math.abs(dx) > Math.abs(dy)) ? "x" : "y";

      // Y 스크롤로 판단되면 overlay 즉시 닫고 스크롤을 양보
      if (axisLocked === "y") {
        if (Math.abs(dy) > MAX_Y && Math.abs(dy) > Math.abs(dx)) {
          dragging = false;
          animating = true;
          hideOverlay();
          setTimeout(() => { animating = false; }, ANIM_MS + 40);
        }
        return;
      }

      ev.preventDefault();

      const w = getViewportW();
      setTrackPx(-w + dx, false);
    }, { passive: false });

    host.addEventListener("touchend", () => {
      if (!dragging) return;
      dragging = false;
      if (!cartItems || cartItems.length === 0) { hideOverlay(); return; }

      const w = getViewportW();
      const threshold = w * THRESHOLD_RATIO;

      if (Math.abs(dx) <= TAP_SLOP && Math.abs(dy) <= TAP_SLOP) {
        animating = true;
        setTrackPx(-w, true);
        setTimeout(() => {
          animating = false;
          hideOverlay();
        }, ANIM_MS + 30);
        return;
      }

      if (Math.abs(dx) < threshold) {
        animating = true;
        setTrackPx(-w, true);
        setTimeout(() => {
          animating = false;
          hideOverlay();
        }, ANIM_MS + 40);
        return;
      }

      if (dx < 0) {
        animating = true;
        setTrackPx(-w - w, true);
        setTimeout(() => {
          animating = false;
          setIndex(currentIndex + 1);
          renderCartPreviewUI();
          hideOverlay();
        }, ANIM_MS + 40);
      } else {
        animating = true;
        setTrackPx(-w + w, true);
        setTimeout(() => {
          animating = false;
          setIndex(currentIndex - 1);
          renderCartPreviewUI();
          hideOverlay();
        }, ANIM_MS + 40);
      }
    }, { passive: true });
  }

  function encourageTag(t){ return t || ""; }

  let __SHOUT_CART_THUMB_UX_BOUND = false;

  function bindThumbUx(){
    if (__SHOUT_CART_THUMB_UX_BOUND) return;
    __SHOUT_CART_THUMB_UX_BOUND = true;

    if (!thumbRowEl) return;

    if (thumbLeftBtn) {
      thumbLeftBtn.addEventListener("click", () => {
        thumbRowEl.scrollBy({ left: -THUMB_SCROLL_STEP, behavior: "smooth" });
      });
    }
    if (thumbRightBtn) {
      thumbRightBtn.addEventListener("click", () => {
        thumbRowEl.scrollBy({ left: THUMB_SCROLL_STEP, behavior: "smooth" });
      });
    }

    thumbRowEl.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        thumbRowEl.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    let isDown = false;
    let startX = 0;
    let startScrollLeft = 0;
    let moved = false;

    thumbRowEl.addEventListener("mousedown", (e) => {
      const target = e.target;
      if (target && target.closest && target.closest(".sh-thumb-nav-btn")) return;

      isDown = true;
      moved = false;
      thumbRowEl.classList.add("is-dragging");
      startX = e.pageX;
      startScrollLeft = thumbRowEl.scrollLeft;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDown) return;
      const dx = e.pageX - startX;
      if (Math.abs(dx) > 3) moved = true;
      thumbRowEl.scrollLeft = startScrollLeft - dx;
    });

    window.addEventListener("mouseup", () => {
      if (!isDown) return;
      isDown = false;
      thumbRowEl.classList.remove("is-dragging");
    });

    thumbRowEl.addEventListener("click", (e) => {
      if (!moved) return;
      e.preventDefault();
      e.stopPropagation();
      moved = false;
    }, true);

    thumbRowEl.addEventListener("scroll", () => {
      updateThumbOverflowUI();
    });

    window.addEventListener("resize", () => {
      updateThumbOverflowUI();
    });
  }

  async function init() {
    
  // init guard: prevent double-run on Webflow
  if (window.__shout_cart_init_ran) return;
  window.__shout_cart_init_ran = true;

ensureCartUi();
    loadCartFromStorage();

    const __didMulti = await renderMultiEventAccordion();

    bindPreviewSwipeIOS();

    if (!__didMulti) {
      renderCartPreviewUI();
      renderCartList();

      bindPreviewNav();
      bindPreviewSwipeIOS();
      bindThumbUx();

      setTimeout(updateThumbOverflowUI, 0);
    }

    if (checkoutBtn) checkoutBtn.onclick = startPayment;

    document.querySelectorAll(".cart-preview-nav").forEach(el => el.remove());


    const intent = sessionStorage.getItem(AUTH_INTENT_KEY);
    if (intent) {
      const data = JSON.parse(intent);
      if (data.after === "start_payment" && localStorage.getItem("shout_users_id")) {
        sessionStorage.removeItem(AUTH_INTENT_KEY);

        const needSync = sessionStorage.getItem("shout_cart_sync_needed") === "true";
        if (needSync) {
          sessionStorage.removeItem("shout_cart_sync_needed");
          syncCartNow("after_login_return");
        }

        setTimeout(startPayment, 300);
      }
    }
  }

  window.addEventListener("pageshow", init);
  init();
});
