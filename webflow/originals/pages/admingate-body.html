
<script>
  (function () {
    var ROOT_ID = "admingate-root";

    function iconUser() {
      return '<svg class="admingate-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor"/></svg>';
    }

    function iconLock() {
      return '<svg class="admingate-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-linecap="round"/></svg>';
    }

    function buildGate() {
      if (document.getElementById(ROOT_ID)) return;

      document.documentElement.classList.add("admingate-lock");
      document.body.classList.add("admingate-lock");

      var root = document.createElement("main");
      root.id = ROOT_ID;
      root.setAttribute("aria-label", "Admin gate");
      root.innerHTML =
        '<section class="admingate-shell">' +
          '<div class="admingate-mark" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 19 7v5.4c0 4.3-2.8 6.7-7 8.1-4.2-1.4-7-3.8-7-8.1V7l7-3.5Z" stroke="currentColor" stroke-linejoin="round"/><path d="m9.4 12.1 1.8 1.8 3.9-4.1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</div>' +
          '<section class="admingate-card">' +
            '<header class="admingate-header">' +
              '<p class="admingate-kicker">Private Console</p>' +
              '<h1 class="admingate-title">Admin Gate</h1>' +
              '<p class="admingate-subtitle">Enter the password to continue to the administrator page.</p>' +
            '</header>' +
            '<form class="admingate-form" id="admingate-form" autocomplete="on">' +
              '<label class="admingate-field">' +
                '<span class="admingate-label">Admin ID</span>' +
                '<span class="admingate-input-wrap">' + iconUser() +
                  '<input class="admingate-input" name="admin_id" type="text" value="Admin" readonly autocomplete="username">' +
                '</span>' +
              '</label>' +
              '<label class="admingate-field">' +
                '<span class="admingate-label">Password</span>' +
                '<span class="admingate-input-wrap">' + iconLock() +
                  '<input class="admingate-input" id="admingate-password" name="admin_password" type="password" placeholder="Enter password" autocomplete="current-password">' +
                '</span>' +
              '</label>' +
              '<p class="admingate-error" id="admingate-error" aria-live="polite"></p>' +
              '<button class="admingate-button" type="submit">Enter Admin</button>' +
            '</form>' +
            '<p class="admingate-footer">Secure access for Shout-out operation tools.</p>' +
          '</section>' +
        '</section>';

      document.body.prepend(root);

      var form = document.getElementById("admingate-form");
      var password = document.getElementById("admingate-password");
      var error = document.getElementById("admingate-error");
      var card = root.querySelector(".admingate-card");
      var button = root.querySelector(".admingate-button");

      setTimeout(function () {
        password.focus();
      }, 80);

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!password.value.trim()) {
          error.textContent = "Password is required.";
          card.classList.remove("is-shaking");
          void card.offsetWidth;
          card.classList.add("is-shaking");
          password.focus();
          return;
        }

        error.textContent = "";
        button.textContent = "Checking...";
        window.dispatchEvent(new CustomEvent("admingate:submit", {
          detail: {
            adminId: "Admin",
            password: password.value
          }
        }));
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", buildGate);
    } else {
      buildGate();
    }
  }());
</script>
