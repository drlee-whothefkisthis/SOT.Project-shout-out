<style>
:root{--gsl-bg:#fff;--gsl-text:#37352f;--gsl-muted:#787774;--gsl-line:#e7e7e5;--gsl-soft:#f7f6f3;--gsl-blue:#2383e2;--gsl-danger:#d44c47;--gsl-radius:10px}
.gsl-page,.gsl-page *{box-sizing:border-box}.gsl-page{width:100%;max-width:480px;margin:0 auto;padding:24px 18px 112px;background:var(--gsl-bg);color:var(--gsl-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:16px;line-height:1.5}.gsl-page button,.gsl-page input,.gsl-page select,.gsl-page textarea{font:inherit}.gsl-icon{margin:4px 0 10px;font-size:36px}.gsl-badge{display:inline-flex;align-items:center;margin:0 0 12px;padding:5px 8px;border-radius:999px;background:#f1f1ef;color:var(--gsl-muted);font-size:12px}.gsl-page h1{margin:0 0 10px;font-size:28px;font-weight:760;line-height:1.25;letter-spacing:-.035em}.gsl-desc{margin:0 0 20px;color:var(--gsl-muted);font-size:14px}.gsl-notice{margin:0 0 28px;padding:14px;border-radius:var(--gsl-radius);background:var(--gsl-soft);font-size:13px}.gsl-section{margin-top:32px}.gsl-section-title{margin:0 0 5px;font-size:19px;font-weight:720;letter-spacing:-.025em}.gsl-section-desc{margin:0 0 18px;color:var(--gsl-muted);font-size:13px}.gsl-field{margin:0 0 22px}.gsl-field .gsl-field{margin-top:14px;margin-bottom:14px}.gsl-label{display:block;margin-bottom:8px;font-size:15px;font-weight:650}.gsl-required{color:var(--gsl-danger)}.gsl-help{margin-top:7px;color:var(--gsl-muted);font-size:12px;line-height:1.5}.gsl-page input,.gsl-page textarea,.gsl-page select{display:block;width:100%;min-height:48px;padding:12px 13px;border:1px solid var(--gsl-line);border-radius:var(--gsl-radius);outline:0;background:#fff;color:var(--gsl-text);font-size:16px}.gsl-page select{padding-right:38px;appearance:auto}.gsl-page input:focus,.gsl-page textarea:focus,.gsl-page select:focus{border-color:#a9a9a5;box-shadow:0 0 0 2px rgba(35,131,226,.12)}.gsl-page textarea{min-height:108px;resize:vertical}.gsl-divider{height:1px;margin:32px 0;background:var(--gsl-line)}.gsl-choices,.gsl-lens-list,.gsl-rental-inputs,.gsl-memory-list,.gsl-pair-list{display:grid;gap:9px}.gsl-choice{display:flex;align-items:center;gap:11px;width:100%;min-height:48px;padding:11px 13px;border:1px solid var(--gsl-line);border-radius:var(--gsl-radius);background:#fff;font-size:15px;cursor:pointer}.gsl-choice input{width:20px;min-width:20px;min-height:20px;height:20px;margin:0;accent-color:var(--gsl-blue)}.gsl-date-range{display:grid;gap:14px}.gsl-packing-point{display:grid;gap:7px}.gsl-mini-label{margin:0;color:var(--gsl-muted);font-size:12px}.gsl-date-time{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.gsl-lens-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center}.gsl-lens-row select,.gsl-pair-row select,.gsl-memory-row select{min-height:44px}.gsl-lens-choice{margin:0}.gsl-equipment-card{padding:12px;border:1px solid var(--gsl-line);border-radius:var(--gsl-radius);background:#fff}.gsl-memory-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center}.gsl-quantity-label{font-size:14px;font-weight:650}.gsl-pair-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 42px;gap:8px;align-items:center}.gsl-remove{width:42px;height:44px;border:1px solid var(--gsl-line);border-radius:10px;background:#fff;color:var(--gsl-muted);font-size:21px;line-height:1;cursor:pointer}.gsl-add{width:100%;min-height:44px;margin-top:10px;border:1px solid #e7e7e3;border-radius:10px;background:#fafafa;color:#a3a39d;font-size:14px;font-weight:500;cursor:pointer}.gsl-submit{position:fixed;z-index:50;bottom:0;left:50%;width:min(480px,100%);min-height:62px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--gsl-line);border-radius:0;transform:translateX(-50%);background:var(--gsl-blue);color:#fff;font-size:16px;font-weight:720;cursor:pointer}.gsl-footer{margin-top:18px;color:var(--gsl-muted);font-size:11px;text-align:center}
.gsl-body-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gsl-row-action{width:42px;height:44px;border:1px solid var(--gsl-line);border-radius:10px;background:#fff;color:var(--gsl-muted);font-size:21px;line-height:1;cursor:pointer}.gsl-row-action.gsl-add-inline{border-color:#bfd8f3;background:#f4f9ff;color:var(--gsl-blue);font-size:25px;font-weight:500}
.gsl-form-message{position:fixed;z-index:51;bottom:72px;left:50%;width:min(448px,calc(100% - 32px));margin:0;padding:10px 12px;border:1px solid #f0c6c3;border-radius:10px;transform:translateX(-50%);background:#fff7f6;color:#a3332f;font-size:13px;line-height:1.45;box-shadow:0 3px 14px rgba(0,0,0,.08)}.gsl-form-message.is-success{border-color:#b9dcc4;background:#f4fbf6;color:#246c3e}.gsl-submit:disabled{background:#9cb9d6;cursor:wait}
.gsl-two-column{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gsl-two-column>.gsl-field{min-width:0}.gsl-two-column>.gsl-field:last-child{margin-bottom:22px}

</style>
